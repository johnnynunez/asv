# Build on every branch push, tag push, and pull request change:
# From: https://github.com/pypa/cibuildwheel/blob/main/examples/github-deploy.yml
# Also:
# https://github.com/airspeed-velocity/asv/blob/main/.github/workflows/wheels.yml
# include [wheel build] in the commit to trigger wheel builds
name: Build wheels
on: [push, pull_request, workflow_dispatch]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  get_commit_message:
    name: Get commit message
    runs-on: ubuntu-latest
    outputs:
      message: ${{ steps.commit_message.outputs.message }}
    steps:
      - name: Checkout asv
        uses: actions/checkout@v6
        # Gets the correct commit message for pull request
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Get commit message
        id: commit_message
        run: |
          set -xe
          COMMIT_MSG=$(git log --no-merges -1 --oneline)
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo github.ref ${{ github.ref }}
  build_wheels:
    name: Build wheels
    needs: get_commit_message
    if: >-
      contains(needs.get_commit_message.outputs.message, '[wheel build]') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && ( ! endsWith(github.ref, 'dev0')))
    runs-on: ${{ matrix.buildplat[0] }}
    strategy:
      # Ensure that a wheel builder finishes even if another fails
      fail-fast: false
      matrix:
        buildplat:
          - [windows-2022, win_amd64]
          - [windows-11-arm, win_arm64]

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so setuptools_scm resolves the release version
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.0

      - uses: actions/upload-artifact@v5
        with:
          name: cibw-wheels-cp-${{ matrix.buildplat[1] }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: get_commit_message
    if: >-
      contains(needs.get_commit_message.outputs.message, '[wheel build]') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && ( ! endsWith(github.ref, 'dev0')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build sdist
        shell: bash -l {0}
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v5
        with:
          path: dist/*.tar.gz

  # Verification only (not part of the upstream PR): test the built ARM64
  # wheels in fresh native environments, outside the source tree.
  test_win_arm64:
    name: Test win_arm64 wheel (${{ matrix.python-version }})
    needs: build_wheels
    runs-on: windows-11-arm
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: arm64
      - uses: actions/download-artifact@v5
        with:
          name: cibw-wheels-cp-win_arm64
          path: wheelhouse
      - name: Install wheel and test deps, run tests
        shell: pwsh
        run: |
          python -c "import sys, platform, sysconfig; print(sys.version, platform.machine(), sysconfig.get_platform())"
          python -m venv "$env:RUNNER_TEMP\venv"
          $py = "$env:RUNNER_TEMP\venv\Scripts\python.exe"
          & $py -m pip install --upgrade pip
          & $py -m pip install --only-binary ":all:" --no-index --find-links wheelhouse asv --no-deps
          if ($LASTEXITCODE) { exit 1 }
          & $py -m pip install --only-binary "numpy,scipy" asv --find-links wheelhouse
          & $py -m pip install --only-binary "numpy,scipy" pytest pytest-timeout pytest-rerunfailures filelock numpy scipy feedparser selenium flaky
          if ($LASTEXITCODE) { exit 1 }
          & $py -m pip list
          New-Item -ItemType Directory "$env:RUNNER_TEMP\t" | Out-Null
          Copy-Item -Recurse test "$env:RUNNER_TEMP\t\test"
          Set-Location "$env:RUNNER_TEMP\t"
          & $py -c "import asv, asv._rangemedian as m, asv.step_detect as s; print(asv.__version__, m.__file__); assert s._rangemedian is m"
          if ($LASTEXITCODE) { exit 1 }
          & $py -m pytest -v -ra --timeout=600 --junitxml=junit.xml test/test_step_detect.py test/test_statistics.py test/test_util.py test/test_results.py test/test_console.py test/test_compare.py
          $rc = $LASTEXITCODE
          New-Item -ItemType Directory "$env:GITHUB_WORKSPACE\evidence" -Force | Out-Null
          Copy-Item junit.xml "$env:GITHUB_WORKSPACE\evidence\junit-${{ matrix.python-version }}.xml"
          exit $rc
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: junit-win_arm64-${{ matrix.python-version }}
          path: evidence/
