name: Windows CI

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # diagnostic: ARM64 with virtualenv environments
        os: ["windows-11-arm"]
        python-version: ["3.14"]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python version ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and test
        shell: pwsh
        run: |
          python.exe -m pip install .[test,envs]
          python.exe -m pip install packaging virtualenv
          python.exe -m pytest -v -l -x --timeout=300 --durations=100 test --environment-type=virtualenv


